# Profilo di test: H2 in modalita PostgreSQL, con Flyway che applica la stessa
# migrazione V1 e Hibernate che la valida (ddl-auto: validate).
spring:
  datasource:
    url: jdbc:h2:mem:simulatore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

logging:
  level:
    it.simulatore.bollette: INFO
