spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  cors:
    # Nel test riproduciamo la richiesta di produzione: l'origine reale deve
    # essere consentita, esattamente come in prod via APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: https://simulatorebolette.fly.dev,http://localhost:5173
