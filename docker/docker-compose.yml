version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: simulatore-postgres
    environment:
      POSTGRES_DB: simulatore_luce
      POSTGRES_USER: simulatore
      POSTGRES_PASSWORD: simulatore123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simulatore -d simulatore_luce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: simulatore-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/simulatore_luce
      SPRING_DATASOURCE_USERNAME: simulatore
      SPRING_DATASOURCE_PASSWORD: simulatore123
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: simulatore-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
